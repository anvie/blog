  <!-- y labels -->
  <text x="78" y="344" font-size="12" fill="#666666" text-anchor="end">0</text>
  <text x="78" y="284" font-size="12" fill="#666666" text-anchor="end">3.000</text>
  <text x="78" y="224" font-size="12" fill="#666666" text-anchor="end">6.000</text>
